
version: "3.9"
services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-heartlink-core}/backend:latest
    environment:
      ENV: prod
      DB_URL: ${DB_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLAMAV_HOST: ${CLAMAV_HOST}
      CLAMAV_PORT: ${CLAMAV_PORT}
      CORS_ORIGINS: https://app.heartlink.love
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-heartlink-core}/frontend:latest
    environment:
      NEXT_PUBLIC_API_BASE: https://api.heartlink.love
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [backend, frontend]
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
